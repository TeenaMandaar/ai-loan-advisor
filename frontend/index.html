<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAI Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      --bg-base: #050505;
      --bg-surface: #0a0a0a;
      --bg-card: #111111;
      
      --accent: #6366F1;
      --accent-dim: rgba(99, 102, 241, 0.1);
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      
      --text-main: #EDEDED;
      --text-muted: #888888;
      
      --border: #1A1A1A;
      
      --font-ui: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius: 8px;
      --inner-glow: inset 0 0 10px rgba(99, 102, 241, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
    }

    /* Grid Layout - Enforced */
    .app-shell {
      display: grid;
      grid-template-columns: 60px 1fr 350px;
      height: 100vh;
      width: 100vw;
    }

    /* Left Sidebar */
    .sidebar {
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      gap: 24px;
      z-index: 10;
    }
    .brand-logo {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--bg-base);
      background: var(--text-main);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      font-size: 1.2rem;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 10px;
      border-radius: var(--radius);
      transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* Center Chat Feed */
    .center-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      position: relative;
      height: 100%;
    }

    .top-bar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .blinking-cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background-color: var(--accent);
      margin-left: 6px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message-row {
      display: flex;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .message-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .message-row.user .msg-avatar {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .message-bubble {
      padding: 16px 20px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 14px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-main);
      max-width: 85%;
      box-shadow: var(--inner-glow);
    }
    .message-row.bot .message-bubble {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #A3A3A3;
    }
    .message-row.user .message-bubble {
      background: var(--bg-card);
      box-shadow: none;
    }

    /* Input Area */
    .input-area {
      padding: 24px 32px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-box {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
      box-shadow: var(--inner-glow);
    }
    .input-box:focus-within {
      border-color: var(--accent);
    }
    .user-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 14px;
      resize: none;
      height: 20px;
      max-height: 120px;
      outline: none;
    }
    .user-textarea::placeholder { color: var(--text-muted); }
    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.8; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Right Panel - Glass Ledger */
    .ledger-panel {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      height: 100%;
    }
    .ledger-header {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .ledger-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    /* Ledger Card Enforced */
    .ledger-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--inner-glow);
    }
    .ledger-card h3 {
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    
    /* Enforced display flex space-between */
    .ledger-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .ledger-stat:last-child { margin-bottom: 0; }

    .stat-label { color: var(--text-muted); }
    .stat-value { 
      font-weight: 500; 
      font-family: var(--font-mono); 
      color: var(--text-main); 
    }
    .stat-accent { color: var(--accent); font-weight: 700; }

    /* Risk Pill */
    .risk-pill-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .risk-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .risk-dot.high { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .risk-dot.moderate { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .risk-dot.low { background: var(--success); box-shadow: 0 0 8px var(--success); }

    /* Sparkline */
    .sparkline-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 16px;
      overflow: hidden;
      display: flex;
    }
    .spark-principal { height: 100%; background: var(--accent); transition: width 0.5s; }
    .spark-interest { height: 100%; background: var(--danger); transition: width 0.5s; }
    .spark-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Utilities */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px;}
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

  <div class="app-shell">

    <!-- ═══ LEFT SIDEBAR ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo">F</div>
      <button class="nav-btn active" data-view="chat" title="Terminal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
      </button>
      <button class="nav-btn" data-view="history" title="History">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </button>
      <button class="nav-btn" id="btn-clear" title="Clear Session" style="margin-top: auto; color: var(--danger);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </aside>

    <!-- ═══ CENTER PANEL (CHAT) ═══ -->
    <main class="center-panel">
      <header class="top-bar">
        FinAI Agent // Status: Online <span class="blinking-cursor"></span>
      </header>
      
      <div class="messages" id="messages">
        <!-- Messages inject here -->
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="user-input" class="user-textarea" placeholder="Enter parameters... (e.g. 60k income, 30L loan for 10 yrs)" rows="1"></textarea>
          <button class="send-btn" id="btn-send" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- ═══ RIGHT PANEL (LIVE LEDGER) ═══ -->
    <aside class="ledger-panel">
      <header class="ledger-header">
        Live Ledger
      </header>
      
      <div class="ledger-content">
        <!-- Scenario Stress Testing -->
        <div class="ledger-card" id="ledger-summary">
          <h3>Current Loan Scenario</h3>
          <div class="ledger-stat">
            <span class="stat-label">Principal</span>
            <span class="stat-value" id="ledg-principal">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Tenure</span>
            <span class="stat-value" id="ledg-tenure">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Interest Rate</span>
            <span class="stat-value" id="ledg-rate">--</span>
          </div>
          <div style="height: 1px; background: var(--border); margin: 16px 0;"></div>
          <div class="ledger-stat">
            <span class="stat-label">Monthly EMI</span>
            <span class="stat-value stat-accent" id="ledg-emi">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Total Interest</span>
            <span class="stat-value" id="ledg-interest">--</span>
          </div>
        </div>

        <div class="ledger-card" id="ledger-risk">
          <h3>Risk Assessment</h3>
          <div class="ledger-stat">
            <span class="stat-label">DTI Ratio</span>
            <span class="stat-value" id="ledg-dti">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Status</span>
            <div class="risk-pill-container">
              <div class="risk-dot" id="ledg-risk-dot"></div>
              <span id="ledg-risk-text">--</span>
            </div>
          </div>
        </div>

        <div class="ledger-card">
          <h3>Interest Trajectory</h3>
          <div class="sparkline-container">
            <div class="spark-principal" id="spark-p" style="width: 0%"></div>
            <div class="spark-interest" id="spark-i" style="width: 0%"></div>
          </div>
          <div class="spark-legend">
            <span>Principal</span>
            <span>Interest Burden</span>
          </div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    'use strict';

    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const messagesContainer = document.getElementById('messages');
    const btnClear = document.getElementById('btn-clear');

    // Ledger Elements
    const ledgPrincipal = document.getElementById('ledg-principal');
    const ledgTenure = document.getElementById('ledg-tenure');
    const ledgRate = document.getElementById('ledg-rate');
    const ledgEmi = document.getElementById('ledg-emi');
    const ledgInterest = document.getElementById('ledg-interest');
    const ledgDti = document.getElementById('ledg-dti');
    const ledgRiskText = document.getElementById('ledg-risk-text');
    const ledgRiskDot = document.getElementById('ledg-risk-dot');
    const sparkP = document.getElementById('spark-p');
    const sparkI = document.getElementById('spark-i');

    const API_BASE = window.location.origin;
    let isTyping = false;

    // Formatters
    const fmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

    userInput.addEventListener('input', () => {
      userInput.style.height = '20px';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
      btnSend.disabled = userInput.value.trim().length === 0 || isTyping;
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!btnSend.disabled) sendMessage();
      }
    });

    btnSend.addEventListener('click', () => {
      if (!btnSend.disabled) sendMessage();
    });

    function appendMessage(role, content) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'U' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      const p = document.createElement('p');
      content.split('\n').forEach((line, i, arr) => {
        p.appendChild(document.createTextNode(line));
        if (i < arr.length - 1) p.appendChild(document.createElement('br'));
      });
      bubble.appendChild(p);

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function updateLedger(data) {
      if (!data) return;
      ledgPrincipal.textContent = fmt.format(data.principal);
      ledgTenure.textContent = `${data.tenure_years} yrs`;
      ledgRate.textContent = `${data.annual_rate}%`;
      ledgEmi.textContent = data.emi_formatted;
      ledgInterest.textContent = data.total_interest_formatted;
      
      ledgDti.textContent = `${data.dti_ratio}%`;
      
      // Update Risk Pill
      ledgRiskText.textContent = data.risk_level;
      const riskClass = data.risk_level.toLowerCase();
      ledgRiskDot.className = `risk-dot ${riskClass}`;

      // Draw Sparkline
      const total = data.total_payment;
      const pPercent = (data.principal / total) * 100;
      const iPercent = (data.total_interest / total) * 100;
      
      sparkP.style.width = `${pPercent}%`;
      sparkI.style.width = `${iPercent}%`;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      userInput.style.height = '24px';
      btnSend.disabled = true;
      isTyping = true;

      // Add a temporary typing indicator
      const typingRow = document.createElement('div');
      typingRow.className = 'message-row bot';
      typingRow.id = 'typing-indicator';
      typingRow.innerHTML = `<div class="msg-avatar">AI</div><div class="message-bubble" style="color:var(--text-muted)">Processing...</div>`;
      messagesContainer.appendChild(typingRow);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        
        document.getElementById('typing-indicator').remove();
        isTyping = false;

        if (data.type === 'calculate' && data.calculation_result) {
          updateLedger(data.calculation_result);
          // The AI only speaks insights now
          appendMessage('bot', data.reply || data.calculation_result.summary);
        } else {
          appendMessage('bot', data.reply || "I didn't quite catch that.");
        }
      } catch (err) {
        document.getElementById('typing-indicator')?.remove();
        isTyping = false;
        appendMessage('bot', "⚠️ Connection error.");
      }
    }

    // Load history into chat on start
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(`${API_BASE}/history`);
        const data = await res.json();
        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(m => appendMessage(m.role, m.content));
        } else {
          setTimeout(() => appendMessage('bot', "System online. Enter loan parameters to begin analysis."), 500);
        }
      } catch (e) {}
    });

    btnClear.addEventListener('click', async () => {
      if (confirm("Clear session?")) {
        await fetch(`${API_BASE}/history`, { method: 'DELETE' });
        messagesContainer.innerHTML = '';
        appendMessage('bot', "System online. Enter loan parameters to begin analysis.");
      }
    });
  </script>
</body>
</html>
