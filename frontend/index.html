<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAI Terminal</title>
  <link rel="stylesheet" href="style.css?v=7.0" />
</head>
<body>

  <div class="app-shell">

    <!-- ═══ LEFT SIDEBAR ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo">F</div>
      <button class="nav-btn active" data-view="chat" title="Terminal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
      </button>
      <button class="nav-btn" data-view="history" title="History">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </button>
      <button class="nav-btn" id="btn-clear" title="Clear Session" style="margin-top: auto; color: var(--danger);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </aside>

    <!-- ═══ CENTER PANEL (CHAT) ═══ -->
    <main class="center-panel">
      <header class="top-bar">
        FinAI Agent // Status: Online <span class="blinking-cursor"></span>
      </header>
      
      <div class="messages" id="messages">
        <!-- Messages inject here -->
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="user-input" class="user-textarea" placeholder="Enter parameters... (e.g. 60k income, 30L loan for 10 yrs)" rows="1"></textarea>
          <button class="send-btn" id="btn-send" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- ═══ RIGHT PANEL (LIVE LEDGER) ═══ -->
    <aside class="ledger-panel">
      <header class="ledger-header">
        Live Ledger
      </header>
      
      <div class="ledger-content">
        <!-- Main Stats -->
        <div class="ledger-card" id="ledger-summary">
          <h3>Current Loan Scenario</h3>
          <div class="ledger-stat">
            <span class="stat-label">Principal</span>
            <span class="stat-value" id="ledg-principal">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Tenure</span>
            <span class="stat-value" id="ledg-tenure">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Monthly EMI</span>
            <span class="stat-value stat-accent" id="ledg-emi">--</span>
          </div>
        </div>

        <!-- Scenarios comparison -->
        <div class="ledger-card" id="ledger-scenarios" style="display: none;">
          <h3>Scenario Stress-Test</h3>
          <div class="scenario-grid">
            <div class="scenario-item" id="scen-agg">
              <span class="scen-title">Aggressive</span>
              <span class="scen-val" id="scen-agg-emi">--</span>
              <span class="scen-sub" id="scen-agg-ten">-- yrs</span>
            </div>
            <div class="scenario-item active" id="scen-bal">
              <span class="scen-title">Balanced</span>
              <span class="scen-val" id="scen-bal-emi">--</span>
              <span class="scen-sub" id="scen-bal-ten">-- yrs</span>
            </div>
            <div class="scenario-item" id="scen-rel">
              <span class="scen-title">Relaxed</span>
              <span class="scen-val" id="scen-rel-emi">--</span>
              <span class="scen-sub" id="scen-rel-ten">-- yrs</span>
            </div>
          </div>
        </div>

        <div class="ledger-card" id="ledger-risk">
          <h3>Risk Assessment</h3>
          <div class="ledger-stat">
            <span class="stat-label">DTI Ratio</span>
            <span class="stat-value" id="ledg-dti">--</span>
          </div>
          <div class="ledger-stat">
            <span class="stat-label">Status</span>
            <div class="risk-pill-container">
              <div class="risk-dot" id="ledg-risk-dot"></div>
              <span id="ledg-risk-text">--</span>
            </div>
          </div>
        </div>

        <div class="ledger-card">
          <h3>Interest Trajectory</h3>
          <div class="sparkline-container">
            <div class="spark-principal" id="spark-p" style="width: 0%"></div>
            <div class="spark-interest" id="spark-i" style="width: 0%"></div>
          </div>
          <div class="spark-legend">
            <span>Principal</span>
            <span>Interest Burden</span>
          </div>
        </div>
      </div>
    </aside>

  </div>

  <script src="app.js?v=5.3"></script>
</body>
</html>
